# GitScrum - GitLab Pipeline Status Sync
#
# Updates task with CI/CD pipeline status.
# Include in your .gitlab-ci.yml

.gitscrum-setup:
  before_script:
    - curl -sL https://raw.githubusercontent.com/gitscrum-core/cli/main/install.sh | sh
    - export PATH="$HOME/.local/bin:$PATH"

# On pipeline success
pipeline-success:
  extends: .gitscrum-setup
  stage: .post
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: on_success
  script:
    - |
      BRANCH="${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME:-$CI_COMMIT_REF_NAME}"
      TASK_CODE=$(echo "$BRANCH" | grep -oE '[A-Z]{2,5}-[0-9]+' | head -1)
      
      if [ -n "$TASK_CODE" ]; then
        gitscrum tasks update "$TASK_CODE" \
          --remove-label "ci-failed" \
          --add-label "ci-passed" \
          --note "✅ Pipeline passed: $CI_PIPELINE_URL"
      fi

# On pipeline failure
pipeline-failed:
  extends: .gitscrum-setup
  stage: .post
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: on_failure
  script:
    - |
      BRANCH="${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME:-$CI_COMMIT_REF_NAME}"
      TASK_CODE=$(echo "$BRANCH" | grep -oE '[A-Z]{2,5}-[0-9]+' | head -1)
      
      if [ -n "$TASK_CODE" ]; then
        gitscrum tasks update "$TASK_CODE" \
          --remove-label "ci-passed" \
          --add-label "ci-failed" \
          --note "❌ Pipeline failed: $CI_PIPELINE_URL"
      fi

# Quality gate check
quality-gate:
  extends: .gitscrum-setup
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - |
      BRANCH="$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME"
      TASK_CODE=$(echo "$BRANCH" | grep -oE '[A-Z]{2,5}-[0-9]+' | head -1)
      
      # Run tests
      if ! make test; then
        if [ -n "$TASK_CODE" ]; then
          gitscrum tasks update "$TASK_CODE" --add-label "tests-failed"
        fi
        exit 1
      fi
      
      if [ -n "$TASK_CODE" ]; then
        gitscrum tasks update "$TASK_CODE" --add-label "tests-passed"
      fi
