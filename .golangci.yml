run:
  timeout: 5m
  go: '1.21'
  
linters:
  disable-all: true
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused

linters-settings:
  govet:
    enable-all: false
    enable:
      - nilness
      - shadow
  staticcheck:
    checks:
      - all
      - -SA1019  # Ignore deprecated warnings

issues:
  exclude-use-default: false
  max-issues-per-linter: 50
  max-same-issues: 10
