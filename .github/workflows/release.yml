name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Run tests
        run: go test -v -race ./...

      - name: Generate completions
        run: |
          mkdir -p completions
          go run ./cmd/gitscrum completion bash > completions/gitscrum.bash
          go run ./cmd/gitscrum completion zsh > completions/_gitscrum
          go run ./cmd/gitscrum completion fish > completions/gitscrum.fish
          go run ./cmd/gitscrum completion powershell > completions/gitscrum.ps1

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

      - name: Warm Go module proxy
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "Warming proxy for $TAG..."
          curl -sf "https://proxy.golang.org/github.com/gitscrum-core/cli/@v/${TAG}.info" || true
          curl -sf "https://proxy.golang.org/github.com/gitscrum-core/cli/@v/${TAG}.mod" || true
          sleep 10

      - name: Refresh Go Report Card
        run: |
          echo "Triggering Go Report Card refresh..."
          curl -sf -X POST -d "repo=github.com/gitscrum-core/cli" https://goreportcard.com/checks || true
          echo "Go Report Card refresh triggered"
